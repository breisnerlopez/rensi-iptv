name: CI

# Static analysis + tests. This is the regression gate that the build
# workflows lacked: it runs `flutter analyze` and `flutter test` on every
# push and PR to main so broken code / failing tests can't merge silently.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      # media_kit needs libmpv at runtime for the player/engine tests.
      - name: Install libmpv
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev libmpv2 mpv

      - name: Install dependencies
        run: flutter pub get

      # Gate on real problems (errors) + the test suite. The repo carries
      # pre-existing lint debt (deprecations, unused imports, etc.) that is not
      # fatal to the build; --no-fatal-warnings/infos keeps CI meaningful without
      # blocking on that legacy debt.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test
