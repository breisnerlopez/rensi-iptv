# build-linux RETIRADO: solo se publican los APK de Android (política actual).
# El build de escritorio Linux ya no se genera. Restaurar desde el historial de
# git (este mismo archivo) si se vuelve a querer el zip de Linux.

  # El release publica SOLO los APK de Android. build-apks es el único job de
  # build (depende de create-release). El App Bundle (.aab, Google Play) y el
  # build de Linux fueron retirados a propósito.
  build-apks:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Generate files
        run: flutter packages pub run build_runner build --delete-conflicting-outputs
      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../keystore.jks
          EOF
      - name: Build Android APKs (split per ABI)
        run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp build/app/outputs/flutter-apk/app-${abi}-release.apk \
               rensi-iptv-android-${abi}-${{ github.ref_name }}.apk
          done
      - name: Remove signing material
        if: always()
        run: rm -f android/keystore.jks android/key.properties
      - name: Upload APK Release Assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: rensi-iptv-android-*-${{ github.ref_name }}.apk
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

# build-aab RETIRADO: el App Bundle (.aab) solo hace falta para publicar en
# Google Play; hoy la política es publicar SOLO los APK. Restaurar este job
# desde el historial de git cuando se vaya a subir a Play.

