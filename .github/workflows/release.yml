name: Create Release

on:
  push:
    tags:
      - 'v*'

# Default workflow token can't touch the Releases API without an
# explicit contents:write grant — without this the create-release job
# bails with a 403 and every other job ends up skipped.
permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Rensi IPTV ${{ github.ref_name }}
          body: |
            ## 🎉 Rensi IPTV ${{ github.ref_name }}

            Reproductor IPTV para **Android móvil y Android TV**.

            ### 📥 Descargas
            - **Android TV / móvil (recomendado)**: `rensi-iptv-android-arm64-v8a-${{ github.ref_name }}.apk`
            - **Emulador Android / equipos x86_64**: `rensi-iptv-android-x86_64-${{ github.ref_name }}.apk`
            - **Dispositivos ARM de 32 bits**: `rensi-iptv-android-armeabi-v7a-${{ github.ref_name }}.apk`

            ### 🔧 Instalación
            - **Android TV / móvil**: instala el APK (sideload). En TV, usa el arm64-v8a.

            ---
            Rensi IPTV is a fork of [bsogulcan/another-iptv-player](https://github.com/bsogulcan/another-iptv-player) — see the repository LICENSE for the dual copyright notice.
          draft: false
          prerelease: false
          generateReleaseNotes: false
          makeLatest: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

